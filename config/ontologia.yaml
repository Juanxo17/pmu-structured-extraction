# Ontologia operativa del dominio — fuente: ERE de Cali.
# Sustituir este archivo por el de otro dominio no requiere tocar codigo.

tipo_evento:
  - sismo
  - movimiento_en_masa
  - inundacion_subita
  - inundacion_lenta
  - incendio_cobertura_vegetal
  - incendio_estructural
  - aglomeracion_publico
  - salud_ambiental

# Nombre legible por cada tipo_evento, para mostrar en tableros/reportes.
tipo_evento_nombres:
  sismo: Sismo
  movimiento_en_masa: Movimiento en masa
  inundacion_subita: Inundación súbita
  inundacion_lenta: Inundación lenta
  incendio_cobertura_vegetal: Incendio de cobertura vegetal
  incendio_estructural: Incendio estructural
  aglomeracion_publico: Aglomeración pública
  salud_ambiental: Salud ambiental

# Codigo: nombre (ERE de Cali, Tabla 8, p. 44). P y Q son funciones institucionales, no reportables.
