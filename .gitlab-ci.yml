variables:
  UV_VERSION: "0.10.9"
  PYTHON_VERSION: "3.12"
  BASE_LAYER: "trixie-slim"
  # cache de uv en lugar de todo el ambiente virtual (miles de archivos)
  UV_CACHE_DIR: ".uv-cache"
  UV_LINK_MODE: "copy"
  # Los builds sean muy rápidos
  DOCKER_BUILDKIT: 1

stages:
  - lint
  - test
  - build
  - deploy

.uv:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  cache:
    key:
      files:
        - pyproject.toml
        - uv.lock
    paths:
      - .uv-cache/
  before_script:
    # Workspace de uv: sin --all-packages no se instalan los servicios
    - uv sync --all-packages --locked

run_lint:
  extends: .uv
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

run_test:
  extends: .uv
  stage: test
  script:
    # Process anonimiza nombres con spaCy; sus pruebas cargan el modelo real
    - uv run --package process python -m spacy download es_core_news_md
    - >
      uv run pytest
      --cov=bff --cov=crud --cov=process --cov=inference --cov=geo
      --cov=sirena_schema --cov=frontend --cov-report=term-missing
  coverage: '/TOTAL.*\s+(\d+%)$/'

build_images:
  stage: build
  image: docker:29.3.0-cli
  services:
    - docker:29.3.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # telegram-source reutiliza la imagen de bff; mlflow usa una imagen publicada
    SERVICIOS: "bff crud process inference geo frontend"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - echo "$REGISTRY_PASS" | docker login -u "$REGISTRY_USER" --password-stdin
  script:
    # docker-compose.yml nombra cada imagen como $REGISTRY_USER/sirena-<servicio>:$IMAGE_TAG
    - export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
    - docker compose build $SERVICIOS
    - docker compose push $SERVICIOS
    # Segundo tag: el build sale completo de la caché de la corrida anterior
    - export IMAGE_TAG="latest"
    - docker compose build $SERVICIOS
    - docker compose push $SERVICIOS

# Despliegue a produccion (VM de Azure). Corre en el GitLab Runner instalado en la VM
# (tag sirena-vm) y usa el mismo docker-compose.yml del repo, con las imagenes que
# build_images acaba de subir a Docker Hub.
deploy:
  stage: deploy
  tags: [sirena-vm]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    # Version exacta que subio build_images (hash corto del commit)
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    # Mismo nombre de proyecto siempre: conserva contenedores y volumenes entre despliegues
    COMPOSE_PROJECT_NAME: sirena
  environment:
    name: produccion
    url: http://64.236.247.2:8501
  script:
    # .env con los secretos de GitLab; INFERENCE_MODELO evita que llegue vacio al servicio
    - printf "GROQ_API_KEY=%s\nTELEGRAM_BOT_TOKEN=%s\nINFERENCE_MODELO=%s\n" "$GROQ_API_KEY" "$TELEGRAM_BOT_TOKEN" "${INFERENCE_MODELO:-openai/gpt-oss-20b}" > .env
    # Descarga las imagenes de este commit y recrea solo los contenedores que cambiaron
    - docker compose pull
    - docker compose up -d --no-build --remove-orphans
    # Limpia imagenes viejas para no llenar el disco
    - docker image prune -f
    # Verifica que el tablero responda (hasta 2 minutos)
    - for i in $(seq 1 24); do curl -fsS -o /dev/null http://localhost:8501 && echo "SIRENA arriba (version $IMAGE_TAG)" && exit 0; sleep 5; done; echo "El frontend no respondio"; exit 1
  after_script:
    # No dejar secretos en la carpeta de trabajo del runner
    - rm -f .env
