variables:
  UV_VERSION: "0.10.9"
  PYTHON_VERSION: "3.12"
  BASE_LAYER: "trixie-slim"
  # cache de uv en lugar de todo el ambiente virtual (miles de archivos)
  UV_CACHE_DIR: ".uv-cache"
  UV_LINK_MODE: "copy"
  # Los builds sean muy rápidos
  DOCKER_BUILDKIT: 1

stages:
  - lint
  - test
  - build

.uv:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  cache:
    key:
      files:
        - pyproject.toml
        - uv.lock
    paths:
      - .uv-cache/
  before_script:
    # Workspace de uv: sin --all-packages no se instalan los servicios
    - uv sync --all-packages --locked

run_lint:
  extends: .uv
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

run_test:
  extends: .uv
  stage: test
  script:
    # Process anonimiza nombres con spaCy; sus pruebas cargan el modelo real
    - uv run --package process python -m spacy download es_core_news_md
    - >
      uv run pytest
      --cov=bff --cov=crud --cov=process --cov=inference --cov=geo
      --cov=sirena_schema --cov=frontend --cov-report=term-missing
  coverage: '/TOTAL.*\s+(\d+%)$/'

build_images:
  stage: build
  image: docker:29.3.0-cli
  services:
    - docker:29.3.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # Nombre fijo del proyecto: compose etiqueta cada imagen como sirena-<servicio>
    COMPOSE_PROJECT_NAME: "sirena"
    SERVICIOS: "bff crud process inference geo frontend"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - echo "$REGISTRY_PASS" | docker login -u "$REGISTRY_USER" --password-stdin
  script:
    - docker compose build $SERVICIOS
    # Hacemos push hacia dockerhub: un repositorio por servicio
    - |
      for servicio in $SERVICIOS; do
        remoto="$REGISTRY_USER/sirena-$servicio"
        docker tag "sirena-$servicio" "$remoto:$CI_COMMIT_SHORT_SHA"
        docker tag "sirena-$servicio" "$remoto:latest"
        docker push "$remoto:$CI_COMMIT_SHORT_SHA"
        docker push "$remoto:latest"
      done
