[project]
name = "sirena-schema"
version = "0.1.0"
description = "Esquema Pydantic compartido y carga de la ontologia"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sirena_schema"]
