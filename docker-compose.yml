# Imagenes: ${REGISTRY_USER}/sirena-<servicio>:${IMAGE_TAG}. En local quedan como sirena/...:latest;
# el pipeline de GitLab define ambas variables para publicarlas en Docker Hub.
# Solo el frontend se publica hacia afuera; el resto escucha en 127.0.0.1 (accesible desde la
# misma maquina) y se comunica entre si por la red interna de compose.
services:
  bff:
    build:
      context: .
      dockerfile: backend/bff/Dockerfile
    image: ${REGISTRY_USER:-sirena}/sirena-bff:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - CRUD_URL=http://crud:8001
      - PROCESS_URL=http://process:8002
    depends_on:
      - crud
      - process

  telegram-source:
    build:
      context: .
      dockerfile: backend/bff/Dockerfile
    image: ${REGISTRY_USER:-sirena}/sirena-bff:${IMAGE_TAG:-latest}
    command: ["uv", "run", "--package", "bff", "python", "-m", "bff.telegram_source"]
    environment:
      - BFF_URL=http://bff:8000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      - bff

  crud:
    build:
      context: .
      dockerfile: backend/crud/Dockerfile
    image: ${REGISTRY_USER:-sirena}/sirena-crud:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - CRUD_DATABASE_PATH=/app/data/sirena.db
    volumes:
      - sirena_db:/app/data

  process:
    build:
      context: .
      dockerfile: backend/process/Dockerfile
    image: ${REGISTRY_USER:-sirena}/sirena-process:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - INFERENCE_URL=http://inference:8003
      - GEO_URL=http://geo:8004
      - CRUD_URL=http://crud:8001
    depends_on:
      - inference
      - geo
      - crud

  inference:
    build:
      context: .
      dockerfile: backend/inference/Dockerfile
    image: ${REGISTRY_USER:-sirena}/sirena-inference:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - INFERENCE_MODELO=${INFERENCE_MODELO}

  geo:
    build:
      context: .
      dockerfile: backend/geo/Dockerfile
    image: ${REGISTRY_USER:-sirena}/sirena-geo:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8004:8004"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ${REGISTRY_USER:-sirena}/sirena-frontend:${IMAGE_TAG:-latest}
    ports:
      - "8501:8501"
    environment:
      - BFF_URL=http://bff:8000
    depends_on:
      - bff

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server --host 0.0.0.0
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root mlflow-artifacts:/mlflow/artifacts
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts

volumes:
  sirena_db:
  mlflow_data:
