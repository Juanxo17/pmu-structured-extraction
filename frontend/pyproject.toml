[project]
name = "frontend"
version = "0.1.0"
description = "Tablero Streamlit, cliente puro de BFF"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.38.0",
    "httpx>=0.27.0",
    "sirena-schema",
]

[tool.uv.sources]
sirena-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frontend"]
