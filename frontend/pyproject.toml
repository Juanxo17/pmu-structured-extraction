[project]
name = "frontend"
version = "0.1.0"
description = "Tablero Streamlit, cliente puro de BFF"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.38.0",
    "httpx>=0.27.0",
    "sirena-schema",
    "streamlit-aggrid>=1.2.1.post2",
    "plotly>=7.0.0",
    "streamlit-folium>=0.27.4",
    "folium>=0.20.0",
]

[tool.uv.sources]
sirena-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frontend"]
