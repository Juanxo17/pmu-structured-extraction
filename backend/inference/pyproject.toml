[project]
name = "inference"
version = "0.1.0"
description = "Cliente de inferencia, prompts y validador/reparacion"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "groq>=0.11.0",
    "sirena-schema",
]

[tool.uv.sources]
sirena-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference"]
