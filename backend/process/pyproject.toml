[project]
name = "process"
version = "0.1.0"
description = "Preprocesamiento (anonimizacion, duplicados) y orquestador de dos etapas"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "sirena-schema",
    "spacy>=3.8.0",
]

[tool.uv.sources]
sirena-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["process"]
